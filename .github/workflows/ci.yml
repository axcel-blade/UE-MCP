name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check mcp_server tests scripts

      - name: Ruff format check
        run: uv run ruff format --check mcp_server tests scripts

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest -q

      - name: Package import smoke
        run: uv run python -c "from mcp_server import __version__; from mcp_server.server import create_server; print(__version__); create_server()"

  plugin-layout:
    name: Plugin layout check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin descriptor and sources
        run: |
          test -f UnrealEngineMCP/UnrealEngineMCP.uplugin
          test -f UnrealEngineMCP/Source/UnrealEngineMCP/UnrealEngineMCP.Build.cs
          test -f UnrealEngineMCP/Source/UnrealEngineMCP/Private/UnrealEngineMCPModule.cpp
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("UnrealEngineMCP/UnrealEngineMCP.uplugin").read_text(encoding="utf-8"))
          assert data["FriendlyName"] == "UnrealEngineMCP"
          assert any(m["Name"] == "UnrealEngineMCP" for m in data["Modules"])
          print("plugin descriptor ok")
          PY
