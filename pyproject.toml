[project]
name = "unreal-engine-mcp"
version = "1.0.3"
description = "Production Unreal Engine 5 Model Context Protocol (MCP) server and editor plugin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AXCEL BLADE" }]
keywords = ["unreal", "unreal-engine", "mcp", "ai", "model-context-protocol"]
dependencies = [
    "mcp>=1.6.0,<2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
unreal-engine-mcp = "mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["mcp_server", "tests", "scripts"]
